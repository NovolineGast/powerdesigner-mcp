[project]
name = "powerdesigner-mcp"
version = "0.1.0"
description = "PowerDesigner Database Modeling Automation MCP Server - lets AI agents operate PowerDesigner (CDM/LDM/PDM) via COM Automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TIQS" }]
keywords = ["mcp", "powerdesigner", "database", "modeling", "automation", "pdm", "cdm"]
dependencies = [
    "mcp>=1.2.0,<2.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
powerdesigner-mcp = "pd_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require a real PowerDesigner installation (deselect with '-m \"not live\"')",
]
