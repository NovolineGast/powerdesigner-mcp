[project]
name = "powerdesigner-mcp"
description = "MCP server that drives PowerDesigner 16.5 over COM: AI agents design CDM/LDM/PDM models, validate them and generate DDL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TIQS" }]
keywords = [
    "mcp", "model-context-protocol", "powerdesigner", "database", "modeling",
    "automation", "com", "cdm", "ldm", "pdm", "ddl", "sql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp>=1.2.0,<2.0",
    "pywin32>=306; sys_platform == 'win32'",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/NovolineGast/powerdesigner-mcp"
Repository = "https://github.com/NovolineGast/powerdesigner-mcp"
Issues = "https://github.com/NovolineGast/powerdesigner-mcp/issues"
Changelog = "https://github.com/NovolineGast/powerdesigner-mcp/commits/main"
Documentation = "https://github.com/NovolineGast/powerdesigner-mcp#readme"

[project.scripts]
powerdesigner-mcp = "pd_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# single source of truth: src/pd_mcp/__init__.py
version = { attr = "pd_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require a real PowerDesigner installation (deselect with '-m \"not live\"')",
]
