name: Release

# Tagging is the release trigger: `git tag v0.1.0 && git push origin v0.1.0`
# publishes to PyPI through Trusted Publishing (OIDC - no API token stored).
# Setup steps: docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(grep -oP '__version__ = "\K[^"]+' src/pd_mcp/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match src/pd_mcp/__init__.py ($pkg)"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/powerdesigner-mcp
    permissions:
      id-token: write          # Trusted Publishing: exchanges the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # fail loudly rather than silently skipping a file
          print-hash: true
          # a version that was already uploaded by hand (or by a re-run) must not
          # turn the tag red - the index is authoritative
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
